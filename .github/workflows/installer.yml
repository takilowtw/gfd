name: windows installer

on:
  push:
    paths:
      - "teiqoflow/**"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: teiqoflow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: teiqoflow
      - name: Ninja
        run: choco install ninja -y --no-progress
      - name: Build app and installer
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: teiqoflow-setup
          path: teiqoflow/dist/teiqoflow-setup.exe
