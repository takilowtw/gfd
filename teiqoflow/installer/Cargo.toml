[package]
name = "teiqoflow-setup"
version = "1.0.0"
edition = "2024"
description = "teiqoflow installer"
build = "build.rs"

[[bin]]
name = "teiqoflow-setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37.0"
flate2 = "1.1.11"
rfd = "0.18.0"
tiny-skia = "0.12.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
flate2 = "1.1.11"
winresource = "0.1.34"
